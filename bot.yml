name: 3L bot

on:
  schedule:
    - cron: "*/10 * * * *"      # каждые 10 минут (GitHub может опаздывать на 5-20 минут)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = обычный проход, check = проверить все ленты"
        default: run
  repository_dispatch:
    types: [tg]                 # мгновенный запуск от реле (worker/relay.js), этап 2

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          MIN_FIT: ${{ vars.MIN_FIT }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python -m bot.main check
          else
            python -m bot.main
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "3l-bot"
          git config user.email "3l-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "state" -q
            git pull --rebase -q || true
            git push -q
          fi
